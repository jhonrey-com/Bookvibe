[package]
name = "bookvibe"
version = "1.2.0"
description = "Open-source desktop book writing, story bible, and EPUB/PDF typesetting app"
authors = ["Bookvibe Contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "bookvibe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
