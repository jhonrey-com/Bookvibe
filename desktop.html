<!doctype html>
<html lang="en" data-theme="ivory" data-runtime="desktop">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f4ef" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' tauri: ipc:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: blob:; frame-src 'self' blob:; connect-src 'self' https: http://localhost:* http://127.0.0.1:* ws://localhost:* ipc: tauri:; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" href="/favicon.ico" />
    <title>Quillvibe Desktop</title>
    <style>
      #qv-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #f6f4ef;
        color: #16181f;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        transition: opacity 220ms ease, visibility 220ms ease;
      }
      @media (prefers-color-scheme: dark) {
        #qv-boot-splash {
          background: #121210;
          color: #e6e3dd;
        }
        #qv-boot-splash .qv-boot-sub {
          color: #a49f96;
        }
        #qv-boot-splash .qv-boot-track {
          background: rgba(255, 255, 255, 0.12);
        }
      }
      #qv-boot-splash.is-leaving {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #qv-boot-splash .qv-boot-title {
        font-size: 19px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      #qv-boot-splash .qv-boot-sub {
        font-size: 12.5px;
        color: #5c606b;
      }
      #qv-boot-splash .qv-boot-track {
        width: 148px;
        height: 3px;
        border-radius: 999px;
        background: rgba(22, 24, 31, 0.12);
        overflow: hidden;
      }
      #qv-boot-splash .qv-boot-fill {
        width: 44%;
        height: 100%;
        border-radius: 999px;
        background: #b9893e;
        animation: qvBootSlide 1.15s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes qvBootSlide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(260%); }
      }
    </style>
  </head>
  <body>
    <div id="qv-boot-splash" role="status" aria-label="Starting Quillvibe Desktop">
      <svg width="64" height="64" viewBox="7 8 50 48" fill="none" aria-hidden="true">
        <path d="M11 27C11 24.4 13.1 22.8 15.6 23.4L32 27.6L48.4 23.4C50.9 22.8 53 24.4 53 27V43.2C53 45.8 51.1 47.9 48.5 48.6L34.6 52.3C32.9 52.8 31.1 52.8 29.4 52.3L15.5 48.6C12.9 47.9 11 45.8 11 43.2V27Z" fill="#7e6644" />
        <path d="M33.2 31.4C33 21.6 38.1 13.8 47.6 12.2C48.4 21.8 43.2 28.8 33.2 31.4Z" fill="#d9b478" />
        <path d="M13.5 23.4C13.5 19.7 16.1 17.7 19.8 18.1C25.8 18.7 30.2 22.8 30.2 29.2V49.1C30.2 50.7 28.6 51.3 27.2 50.1C23.6 47 19.9 45.6 17.1 45.2C14.7 44.8 13.5 43.1 13.5 40.3V23.4Z" fill="#f5f2eb" stroke="#2b241d" stroke-opacity="0.24" stroke-width="0.9" />
        <path d="M33.8 35.4C33.8 29.8 38.1 26.2 44.2 26H45.8C48.8 26 50.8 28 50.8 31V40.6C50.8 43.2 49.4 44.8 46.8 45.2C43.9 45.6 40.3 47 36.7 50.1C35.3 51.3 33.8 50.7 33.8 49.1V35.4Z" fill="#dfd9cd" stroke="#2b241d" stroke-opacity="0.24" stroke-width="0.9" />
      </svg>
      <div class="qv-boot-title">Quillvibe</div>
      <div class="qv-boot-sub">Launching desktop workspace…</div>
      <div class="qv-boot-track"><div class="qv-boot-fill"></div></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/desktop/entry.ts"></script>
  </body>
</html>
