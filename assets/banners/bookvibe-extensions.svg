<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 175" width="1200" height="175" fill="none">
  <rect width="1200" height="175" rx="10" fill="#0b0c10" />
  <rect x="0.5" y="0.5" width="1199" height="174" rx="9.5" stroke="#1f232d" />

  <!-- Left: Official Document File Formats -->
  <g transform="translate(28, 24)">
    <text x="0" y="16" fill="#c7a97b" font-family="ui-monospace, Consolas, monospace" font-size="11.5" letter-spacing="1.2">OFFICIAL FILE FORMATS</text>
    <text x="0" y="42" fill="#eceef2" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="600">Double-Clickable Bookvibe Documents</text>
    <rect x="0" y="60" width="540" height="66" rx="6" fill="#0f1117" stroke="#232734" />
    <text x="16" y="88" fill="#f2efe8" font-family="ui-monospace, Consolas, monospace" font-size="13">.bookvibe   .bvibe   .bvbook   .bvbible   .bvscene   .bvstyle</text>
    <text x="16" y="110" fill="#8e95a3" font-family="Inter, 'Segoe UI', sans-serif" font-size="12">Default export selectable in topbar dropdown · Registered automatically with OS shell</text>
  </g>

  <line x1="600" y1="22" x2="600" y2="153" stroke="#1f232d" />

  <!-- Right: Extension Permission Sandbox -->
  <g transform="translate(632, 24)">
    <text x="0" y="16" fill="#67b08c" font-family="ui-monospace, Consolas, monospace" font-size="11.5" letter-spacing="1.2">SANDBOXED EXTENSIONS (.BVEXT)</text>
    <text x="0" y="42" fill="#eceef2" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="600">Integrated Toolkits &amp; Consent-Gated External Plugins</text>
    <rect x="0" y="60" width="540" height="66" rx="6" fill="#0f1117" stroke="#232734" />
    <text x="16" y="88" fill="#67b08c" font-family="ui-monospace, Consolas, monospace" font-size="12.5">ALLOWED: Scoped scene rules · Readability · Print presets</text>
    <text x="16" y="110" fill="#d07070" font-family="ui-monospace, Consolas, monospace" font-size="12">BLOCKED: Internet requests · Disk access · Author keys · Arbitrary JS</text>
  </g>
</svg>
