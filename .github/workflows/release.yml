name: Quillvibe Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  release:
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: ubuntu-24.04-arm
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux desktop dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build and publish Quillvibe release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Quillvibe v__VERSION__'
          releaseBody: 'Standalone native installers and executables for Windows (.msi / .exe), macOS Universal (.dmg), Linux x64 and ARM64 (.AppImage / .deb / .rpm), and offline PWA for Chromebook (ChromeOS), Android, iPadOS, and all browsers at https://quillvibe.jhonrey.com/.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  mark-older-releases:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish full changelog and mark previous releases as pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/build-release-notes.py --tag "$CURRENT_TAG" --output current-notes.md
          gh release edit "$CURRENT_TAG" --latest --notes-file current-notes.md
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import tempfile

          current_tag = os.environ["CURRENT_TAG"]
          raw = subprocess.check_output(
              ["gh", "release", "list", "--limit", "100", "--json", "tagName"],
              text=True,
          )
          for item in json.loads(raw):
              tag = item["tagName"]
              if tag == current_tag:
                  continue
              with tempfile.NamedTemporaryFile("w", suffix=".md", delete=False, encoding="utf-8") as tmp:
                  tmp_path = tmp.name
              try:
                  res = subprocess.run(
                      ["python3", "scripts/build-release-notes.py", "--tag", tag, "--outdated", "--output", tmp_path],
                      check=False,
                  )
                  if res.returncode != 0:
                      continue
                  subprocess.run(
                      ["gh", "release", "edit", tag, "--prerelease", "--notes-file", tmp_path],
                      check=True,
                  )
              finally:
                  if os.path.exists(tmp_path):
                      os.unlink(tmp_path)
          PY
