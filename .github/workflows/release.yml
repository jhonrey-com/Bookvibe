name: Quillvibe Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  release:
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build and publish Quillvibe release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Quillvibe v__VERSION__'
          releaseBody: 'Standalone native installers and executables for Windows (.msi / .exe), macOS Universal (.dmg), and Linux (.AppImage / .deb / .rpm) with official Quillvibe QVBX file extensions (.qv, .qvbible, .qvscene, .qvstyle, .qvdesign). Also available directly in the browser at https://quillvibe.jhonrey.com/.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  mark-older-releases:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Mark previous releases as pre-release with outdated warning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import tempfile

          current_tag = os.environ["CURRENT_TAG"]
          banner = (
              "> [!WARNING]\n"
              "> **Outdated Release — Not Recommended for Download**\n"
              "> This is an older build of Quillvibe and may contain bugs that have already been fixed. "
              "Please download the newest version from the [**Latest Release**](https://github.com/jhonrey-com/Quillvibe/releases/latest) "
              "or use the web app at **https://quillvibe.jhonrey.com/**.\n\n"
              "---\n\n"
          )

          raw = subprocess.check_output(
              ["gh", "release", "list", "--limit", "100", "--json", "tagName"],
              text=True,
          )
          for item in json.loads(raw):
              tag = item["tagName"]
              if tag == current_tag:
                  continue
              body = subprocess.check_output(
                  ["gh", "release", "view", tag, "--json", "body", "-q", ".body"],
                  text=True,
              )
              if "Outdated Release — Not Recommended for Download" not in body:
                  new_body = banner + body.lstrip()
              else:
                  new_body = body
              with tempfile.NamedTemporaryFile("w", suffix=".md", delete=False, encoding="utf-8") as tmp:
                  tmp.write(new_body)
                  tmp_path = tmp.name
              try:
                  subprocess.run(
                      ["gh", "release", "edit", tag, "--prerelease", "--notes-file", tmp_path],
                      check=True,
                  )
              finally:
                  os.unlink(tmp_path)
          PY
